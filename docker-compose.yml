services:
  whatsapp-group-agent:
    build: .
    container_name: whatsapp-group-agent
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./auth_state:/app/auth_state
      - ./data:/app/data
    # Needed the first time, to type the pairing code interactively:
    #   docker compose run --rm whatsapp-group-agent
    # After that, `docker compose up -d` runs it in the background.
    stdin_open: true
    tty: true
    # Not published to the host on purpose — only reachable through the
    # Caddy reverse proxy below, which terminates HTTPS.

  caddy:
    image: caddy:2-alpine
    container_name: whatsapp-group-agent-caddy
    restart: unless-stopped
    depends_on:
      - whatsapp-group-agent
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
