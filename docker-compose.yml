services:
  whatsapp-group-agent:
    build: .
    container_name: whatsapp-group-agent
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./auth_state:/app/auth_state
      - ./data:/app/data
    # Needed the first time, to type the pairing code interactively:
    #   docker compose run --rm whatsapp-group-agent
    # After that, `docker compose up -d` runs it in the background.
    stdin_open: true
    tty: true
